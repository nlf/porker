name: CI

on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node_version: 20.x
      - name: Update npm
        run: npm i -g npm --no-audit --no-fund
      - name: Install dependencies
        run: npm i --no-audit --no-fund
      - name: Lint
        run: npm run lint
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: porker-test
          POSTGRES_USER: porker-test
          POSTGRES_PASSWORD: porker-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node_version: 20.x
      - name: Update npm
        run: npm i -g npm --no-audit --no-fund
      - name: Install dependencies
        run: npm i --no-audit --no-fund
      - name: Test
        run: npm run test --ignore-scripts
